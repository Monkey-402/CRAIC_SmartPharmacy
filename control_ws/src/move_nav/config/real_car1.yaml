# 赛场实车 — 1 号车（192.168.124.3，TCP server）
# 启动：roslaunch move_nav real_car1.launch

yaofang_control_service_node:
  car_id: "1"
  dual_car_mode: true
  initial_station: "home"
  first_mover_car_id: "1"
  standby_x: -1.125
  standby_y: 0.207
  standby_yaw: 0.050
  require_peer_tcp: true
  peer_tcp_wait_timeout: 120.0
  enable_prestart_countdown: true
  prestart_countdown_sec: 5.0
  min_samples_team_round: 4
  last_round_prefer_sample_count: 2
  require_judgement_tcp: true
  judgement_connected_topic: "/judgement/peer_connected"
  match_start_wait_timeout: 300.0
  odom_topic: "/odom"
  use_tf_pose: true
  map_frame: "map"
  base_frame: "base_link"
  enable_judgement_report: true
  judgement_report_topic: "/judgement/report"
  judgement_report_rate: 1.5
  default_cv1: "WAIT-0"
  default_cv2: ""
  default_task: "R"

car_tcp_bridge:
  role: "server"
  peer_ip: "192.168.124.3"
  port: 9000
  send_topic: "/car_link/send"
  recv_topic: "/car_link/recv"
  connected_topic: "/car_link/peer_connected"
  reconnect_interval: 2.0

judgement_tcp_sender:
  server_ip: "192.168.124.29"
  server_port: 8888
  send_rate: 1.5
  connect_retry_interval: 2.0
  input_topic: "/judgement/report"
  connected_topic: "/judgement/peer_connected"
