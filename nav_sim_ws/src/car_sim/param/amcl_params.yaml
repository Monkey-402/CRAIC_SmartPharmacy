# 对齐 robot_ws_official/robot_navigation/param/EPRobot/amcl_params.yaml
# 保留 craic 调参：update_min_d / update_min_a
# 与 nav_real_ws 完全一致

use_map_topic: true

odom_frame_id: "odom"
base_frame_id: "base_footprint"
global_frame_id: "map"

odom_model_type: "diff"
odom_alpha5: 0.0
gui_publish_rate: 10.0

laser_max_beams: 100
laser_max_range: 12.0
min_particles: 1000
max_particles: 5000
kld_err: 0.05
kld_z: 0.99

odom_alpha1: 1.5
odom_alpha2: 1.2
odom_alpha3: 1.2
odom_alpha4: 1.5

laser_z_hit: 0.7
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.3
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_model_type: "likelihood_field"
laser_likelihood_max_dist: 2.0

# craic 保留（官方为 0.25 / 0.1）
update_min_d: 0.10
update_min_a: 0.05

resample_interval: 1
transform_tolerance: 1.0
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.1
