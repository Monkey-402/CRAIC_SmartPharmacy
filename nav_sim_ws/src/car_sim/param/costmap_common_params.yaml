# 对齐 robot_ws_official/robot_navigation/param/EPRobot/costmap_common_params.yaml
# craic 保留：激光 topic 经 launch remap；sensor_frame 为 base_laser_link
# 与 nav_real_ws 完全一致

footprint: [[-0.14, -0.11], [0.14, -0.11], [0.14, 0.11], [-0.14, 0.11]]

transform_tolerance: 0.2
map_type: map

obstacle_layer:
  enabled: true
  obstacle_range: 6.5
  raytrace_range: 6.0
  inflation_radius: 0.15
  track_unknown_space: true
  combination_method: 1

  observation_sources: laser_scan_sensor
  laser_scan_sensor: {sensor_frame: base_laser_link, data_type: LaserScan, topic: scan, marking: true, clearing: true}

inflation_layer:
  enabled: true
  cost_scaling_factor: 12.0
  inflation_radius: 0.15

static_layer:
  enabled: true
  map_topic: "/map"
